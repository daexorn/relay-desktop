name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo test --locked
      - run: python -m unittest discover -s tests -v
        if: runner.os == 'Linux'
      - run: cargo build --release --locked
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Relay-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.json
