[package]
name = "relay-desktop"
version = "0.3.0"
edition = "2021"
description = "A small native desktop for Claude Code on your servers"
license = "MIT"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui_commonmark = { version = "=0.20.0", default-features = false, features = ["pulldown_cmark"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
russh = { version = "=0.65.0", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 0


[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
egui_commonmark = { path = "vendor/egui_commonmark" }
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }
